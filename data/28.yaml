# An incident with its billing system affected 1.4% of customers when it did not update customer balances, recharged customers multiple times, or suspended accounts as a result of recharging deactivated credit cards. This occurred when a redis cluster experienced a network connectivity loss, and resynchronizing the secondaries overloaded the primary.
#

AI-1:
  # Observing extreme load on the host, the redis process on redis-master was misdiagnosed as requiring a restart to recover. This caused redis-master to read an incorrect configuration file, which in turn caused Redis to attempt to recover from a non-existent AOF file, instead of the binary snapshot. As a result of that failed recovery, redis-master dropped all balance data. In addition to forcing recovery from a non-existent AOF, an incorrect configuration also caused redis-master to boot as a slave of itself, putting it in read-only mode and preventing the billing system from updating account balances. [We will...] As a further preventative measure, Redis restarts on redis-master are disabled and [continued below ...]

  experience: Restarting the redis master was unnecessary (misdiagnosis), caused it to read an incorrect configuration file, dropped all balance data, and caused it to boot as a secondary as itself in read-only mode.
  action: Disable restarts on primary nodes
  target: Redis configuration & recovery process
  goal: Ensure recovery is performed in a more safe manner

  lifecycle:
    - Response / Diagnosis
    - Response / Mitigation
    - Failure / Downstream Effects
  action-type: evo / subtract
  sts: Process / Incident response / Procedures
  intended-effect:
    - Interaction Capability / Operability
    - Reliability / Recoverability
  google-ai: mitigate future

  matrix-influence: consequence
  matrix-approach: vulnerability

